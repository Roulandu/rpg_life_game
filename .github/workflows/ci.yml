name: CI
run-name: CI ${{ github.sha }} (${{ github.ref_name }})

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 对比基线（留空时按 ref 自动推断）
        required: false
        default: ''
  schedule:
    # 每周一 02:00（北京时间）巡检默认分支
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      INPUT_BASE: ${{ inputs.base }}
      BEFORE_SHA: ${{ github.event.before }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Resolve quality base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          root_commit() { git rev-list --max-parents=0 HEAD | tail -n 1; }
          base=''

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "${INPUT_BASE:-}" ]; then
            base="$INPUT_BASE"
          elif [ "$IS_TAG" = "true" ]; then
            base="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || root_commit)"
          elif [ "$EVENT_NAME" = "push" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
              base="$BEFORE_SHA"
            elif git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
              base='HEAD~1'
            else
              base="$(root_commit)"
            fi
          else
            base='origin/main'
          fi

          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "对比基线不可达：$base；拒绝以空范围继续。" >&2
            exit 1
          fi
          echo "QUALITY_BASE=$base" >> "$GITHUB_ENV"
          echo "resolved=$base" >> "$GITHUB_OUTPUT"

      - name: Verify
        id: verify
        run: npm run verify -- --full --base "$QUALITY_BASE"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            quality/reports/
            coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '## CI 验证摘要'
            echo
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| SHA | \`$GITHUB_SHA\` |"
            echo "| ref | \`${GITHUB_REF:-unknown}\` |"
            echo "| event | \`${EVENT_NAME:-unknown}\` |"
            echo "| base | \`${{ steps.base.outputs.resolved }}\` |"
            echo "| verify | \`${{ steps.verify.outcome }}\` |"
            echo "| artifact | \`verify-$GITHUB_SHA-${{ github.run_attempt }}\` |"
            echo "| run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo '验证报告与覆盖率已作为 artifact 上传，保留 14 天。本地通过不等于本次远端通过，以本 run 的 verify 结论为准。'
          } >> "$GITHUB_STEP_SUMMARY"
