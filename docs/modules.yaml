version: 1

# src 根目录下的组合根文件归属到 app
rootModule: app
rootFiles:
  - src/main.tsx
  - src/router.tsx

# 内联平台判断/平台 API 直接调用；新代码必须走 src/platform 端口
knownPlatformViolations: []

modules:
  app:
    path: src/app
    publicEntry: src/app/index.ts
    allowedDeps: [ui, store, platform, domain, lib]
    tests: [tests/app/**/*.test.tsx]
    docs:
      - docs/architecture/overview.md
      - docs/features/appearance.md
    testImpact: exempt
    platformCapabilities: [composition]
    knownViolations: []

  ui:
    path: src/ui
    publicEntry: src/ui/index.ts
    allowedDeps: [store, domain, lib, platform]
    tests: [tests/ui/**/*.test.tsx]
    docs:
      - docs/features/weekly-turn.md
      - docs/features/matchday.md
      - docs/features/gm-agent.md
      - docs/features/saves.md
      - docs/features/appearance.md
    testImpact: via-module
    platformCapabilities: [ui]
    knownViolations: []

  store:
    path: src/store
    publicEntry: src/store/index.ts
    allowedDeps: [engine, world, llm, db, platform, domain, lib]
    tests: [tests/store/**/*.test.ts]
    docs:
      - docs/features/weekly-turn.md
      - docs/features/saves.md
      - docs/features/gm-agent.md
      - docs/features/appearance.md
    testImpact: strict
    platformCapabilities: [session]
    knownViolations: []

  engine:
    path: src/engine
    publicEntry: src/engine/index.ts
    allowedDeps: [domain, lib]
    tests: [tests/engine/**/*.test.ts]
    docs:
      - docs/features/weekly-turn.md
      - docs/features/matchday.md
    testImpact: strict
    platformCapabilities: [core]
    knownViolations: []

  world:
    path: src/world
    publicEntry: src/world/index.ts
    allowedDeps: [domain, lib]
    tests:
      - tests/engine/world.test.ts
      - tests/db/save.test.ts
      - tests/world/**/*.test.ts
    docs: [docs/features/world-generation.md]
    testImpact: strict
    platformCapabilities: [core]
    knownViolations: []

  llm:
    path: src/llm
    publicEntry: src/llm/index.ts
    allowedDeps: [domain, lib, platform]
    tests: [tests/llm/**/*.test.ts]
    docs: [docs/features/gm-agent.md]
    testImpact: strict
    platformCapabilities: [http, secure-storage]
    knownViolations: []

  db:
    path: src/db
    publicEntry: src/db/index.ts
    allowedDeps: [domain, lib]
    tests: [tests/db/**/*.test.ts]
    docs:
      - docs/features/saves.md
      - docs/data-model.md
    testImpact: strict
    platformCapabilities: [persistence]
    knownViolations: []

  platform:
    path: src/platform
    publicEntry: src/platform/index.ts
    allowedDeps: [lib]
    tests: [tests/platform/**/*.test.ts]
    docs:
      - docs/architecture/platform-strategy.md
      - docs/features/saves.md
      - docs/features/appearance.md
    testImpact: exempt
    platformCapabilities:
      - secure-storage
      - http
      - file-export
      - lifecycle
      - persistence
      - device-info
      - appearance
    knownViolations: []

  domain:
    path: src/domain
    publicEntry: src/domain/index.ts
    allowedDeps: [lib]
    tests: [tests/**/*.test.ts]
    docs:
      - docs/data-model.md
      - docs/interfaces/engine-api.md
    testImpact: strict
    platformCapabilities: [core]
    knownViolations: []

  lib:
    path: src/lib
    publicEntry: src/lib/index.ts
    allowedDeps: []
    tests: [tests/**/*.test.ts]
    docs: [docs/architecture/overview.md]
    testImpact: strict
    platformCapabilities: [core]
    knownViolations: []
